name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  receiver:
    # Compiles the NX receiver with the .NET Framework compiler (the one NX itself uses for
    # journals) against a stub of NX Open, then runs the real kernel end-to-end without NX.
    name: NX receiver (C# 5, no NX)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Compile stub and loader journals
        shell: pwsh
        run: |
          $fw = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319"
          New-Item -ItemType Directory -Force build | Out-Null
          & "$fw\csc.exe" /nologo /target:library /out:build\NXOpen.dll tests\nx_stub\NXOpenStub.cs
          if ($LASTEXITCODE) { exit 1 }
          & "$fw\csc.exe" /nologo /target:exe /out:build\NxAiBridgeReceiver.exe /r:build\NXOpen.dll nx_receiver\NxAiBridgeReceiver.cs
          if ($LASTEXITCODE) { exit 1 }
          & "$fw\csc.exe" /nologo /target:exe /out:build\NxAiBridgeSelfCheck.exe /r:build\NXOpen.dll nx_receiver\NxAiBridgeSelfCheck.cs
          if ($LASTEXITCODE) { exit 1 }
          & "$fw\vbc.exe" /nologo /target:exe /out:build\NxAiBridgeReceiverVb.exe /r:build\NXOpen.dll nx_receiver\vb\NxAiBridgeReceiver.vb
          if ($LASTEXITCODE) { exit 1 }
          & "$fw\vbc.exe" /nologo /target:exe /out:build\NxAiBridgeSelfCheckVb.exe /r:build\NXOpen.dll nx_receiver\vb\NxAiBridgeSelfCheck.vb
          if ($LASTEXITCODE) { exit 1 }
      - name: Run the real kernel end-to-end
        shell: pwsh
        run: |
          $env:NX_AI_BRIDGE_TEST_RECEIVER = (Resolve-Path build\NxAiBridgeReceiver.exe).Path
          $env:NX_AI_BRIDGE_TEST_SELFCHECK = (Resolve-Path build\NxAiBridgeSelfCheck.exe).Path
          python -m pytest -q tests/test_receiver_windows.py -rA
      - name: VB fallback loader starts the same kernel
        shell: pwsh
        run: |
          $env:NX_AI_BRIDGE_TEST_RECEIVER = (Resolve-Path build\NxAiBridgeReceiverVb.exe).Path
          python -m pytest -q tests/test_receiver_windows.py -k "roundtrip or compile_check"
      - name: PowerShell scripts parse
        shell: powershell
        run: |
          foreach ($f in 'install.ps1', 'selfcheck.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$f : $_" }; exit 1 }
          }
          .\install.ps1 -HomeDir "$PWD\build\install-home" -SkipPython
          if (-not (Test-Path build\install-home\nx_receiver\NxAiBridgeReceiver.cs)) { Write-Error "install.ps1 did not copy the receiver"; exit 1 }
          .\selfcheck.ps1 -HomeDir "$PWD\build\install-home" -NoPause
          if (-not (Test-Path build\install-home\reports\env-report.json)) { Write-Error "selfcheck.ps1 wrote no env report"; exit 1 }
          Get-Content build\install-home\reports\env-report.json
      - name: install.ps1 end-to-end (creates a venv, then the installed CLI talks to the mock)
        shell: powershell
        run: |
          $summary = (.\install.ps1 -HomeDir "$PWD\build\full-home" -Quiet | Out-String) | ConvertFrom-Json
          if (-not $summary.mcp_server_command) { Write-Error "install.ps1 found no way to start the MCP server: $($summary.python)"; exit 1 }
          $exe = $summary.mcp_server_command[0]
          $env:NX_AI_BRIDGE_HOME = "$PWD\build\full-home"
          $env:NX_AI_BRIDGE_TRANSPORT = "mock"
          & $exe demo --part "$PWD\build\bracket.prt"
          if ($LASTEXITCODE) { Write-Error "demo failed"; exit 1 }
          $env:NX_AI_BRIDGE_TRANSPORT = "auto"
          & $exe doctor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receiver-test-output
          path: |
            build/install-home/reports
          if-no-files-found: ignore
